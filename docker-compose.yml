name: skerter-website

services:
  site:
    image: ghcr.io/skerter/skerter-website:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.skerter.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.skerter.entrypoints=websecure"
      - "traefik.http.routers.skerter.tls.certresolver=letsencrypt"
      - "traefik.http.services.skerter.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
