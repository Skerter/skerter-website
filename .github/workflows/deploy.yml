name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/skerter/skerter-website

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /opt/skerter-website
            cd /opt/skerter-website

            if [ -d .git ]; then
              git fetch origin master
              git checkout master
              git reset --hard origin/master
            else
              git clone https://github.com/Skerter/skerter-website.git .
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin || true
            docker compose up -d --build --remove-orphans
            docker compose ps
            docker image prune -f
